<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Choshux</title>
  <style>
    /* リセット & ベーススタイル */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #08080a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景のスタイリッシュなグラデーション光 */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(50, 100, 255, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 8s ease-in-out infinite alternate;
    }

    /* 微細なグリッドパターン（奥行き感の演出） */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      pointer-events: none;
    }

    /* コンテナ */
    .container {
      position: relative;
      text-align: center;
      padding: 24px;
      z-index: 1;
      max-width: 90vw;
    }

    /* サブタイトル・タグ */
    .badge {
      display: inline-block;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 18px;
      border-radius: 9999px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
      opacity: 0;
      animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    /* メインタイトル */
    .title {
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeInUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
    }

    /* アニメーション用アンダーライン */
    .divider {
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      margin: 28px auto 0;
      animation: expandLine 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
    }

    /* キーフレームアニメーション */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-16px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes expandLine {
      0% {
        width: 0;
        opacity: 0;
      }

      100% {
        width: 140px;
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <main class="container">
    <span class="badge">Official Portal</span>
    <h1 class="title">Welcome to Choshux!</h1>
    <div class="divider"></div>
  </main>
</body>

</html>
